name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Uji dan build exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Susun renderer luring dan server MCP
        run: npm run build

      - name: Uji unit, MCP mode berkas, dan MCP mengendalikan aplikasi
        run: npm run test:ci
        env:
          RANCANG_UJI_ELECTRON: '1'

      - name: Uji asap aplikasi desktop
        run: npx electron . --uji-asap --use-angle=swiftshader
        env:
          RANCANG_UJI_HASIL: uji-asap.json

      - name: Build Setup.exe dan Portable.exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Paketkan RANCANG.mcpb
        run: |
          npm run pack:mcpb
          Copy-Item build/RANCANG.mcpb dist/RANCANG.mcpb

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: RANCANG-windows
          path: |
            dist/RANCANG-Setup-*.exe
            dist/RANCANG-Portable-*.exe
            dist/RANCANG.mcpb
          if-no-files-found: error
          retention-days: 14

      - name: Unggah hasil uji asap (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uji-asap
          path: uji-asap.json
          if-no-files-found: ignore

  release:
    name: Terbitkan Release
    # Release otomatis saat versi package.json di main belum punya Release (atau saat tag v* didorong manual)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan versi dan cek Release yang sudah ada
        id: versi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSI=$(node -p "require('./package.json').version")
          TAG="v$VERSI"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi package.json ($TAG)."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada; tidak ada yang diterbitkan. Naikkan version di package.json untuk rilis baru."
            echo "terbit=false" >> "$GITHUB_OUTPUT"
          else
            echo "terbit=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.versi.outputs.terbit == 'true'
        with:
          name: RANCANG-windows
          path: rilis

      - name: Buat Release
        if: steps.versi.outputs.terbit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versi.outputs.tag }}
        run: |
          gh release create "$TAG" rilis/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RANCANG $TAG" \
            --notes-file docs/catatan-rilis.md \
            --generate-notes
